{% extends 'base.html' %}
{% block title %}Post Need{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2>Post a Need</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label">{{ field.label }}</label>
          {{ field|add_class:"form-control" }}
          {% for err in field.errors %}<div class="text-danger">{{ err }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button class="btn btn-primary">Post Need</button>
    </form>
  </div>
</div>
{% endblock %}
