{% extends 'base.html' %}
{% block title %}Upload Proof{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4 text-center">Upload Proof for "{{ need.title }}"</h2>
<form method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm mx-auto" style="max-width:600px;">
  {% csrf_token %}
  <div class="mb-3">
    <label>Upload Receipt or Proof (image/pdf)</label>
    <input type="file" name="receipt" class="form-control" required>
  </div>
  <div class="mb-3">
    <label>Description</label>
    <textarea name="description" class="form-control" rows="3" required></textarea>
  </div>
  <button type="submit" class="btn btn-success w-100">Upload Proof</button>
</form>
{% endblock %}
