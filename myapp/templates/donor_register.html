{% extends 'base.html' %}
{% block title %}Donor Registration{% endblock %}
{% block content %}
<h2 class="fw-bold mb-4 text-center">Donor Registration</h2>

<form method="POST" class="card p-4 shadow-sm mx-auto" style="max-width:600px;">
  {% csrf_token %}
  
  {% for field in form %}
    <div class="mb-3">
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}
        <div class="text-danger small">{{ field.errors }}</div>
      {% endif %}
    </div>
  {% endfor %}

  <button type="submit" class="btn btn-primary w-100">Register</button>
</form>
{% endblock %}
